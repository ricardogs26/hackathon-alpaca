name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ow
          POSTGRES_PASSWORD: ow
          POSTGRES_DB: ow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ow" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPTIONWRIGHT_TEST_DSN: postgresql://ow:ow@localhost:5432/ow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - run: ruff check optionwright tests
      - run: python scripts/check_dashboard_js.py
      - run: pytest
