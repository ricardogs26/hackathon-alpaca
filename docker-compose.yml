# One command for judges: `docker compose up` brings up the agent with its own
# Postgres. Fill .env first (Alpaca paper keys + an LLM endpoint).
services:
  agent:
    build: .
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8080:8080"          # dashboard + API
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: optionwright
      POSTGRES_USER: optionwright
      POSTGRES_PASSWORD: change-me
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optionwright"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
