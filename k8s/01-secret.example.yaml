# Plantilla. NO commitear el secret real con llaves.
# Crear en el cluster con:
#   kubectl create secret generic optionwright-secrets -n hackathon \
#     --from-literal=ALPACA_API_KEY=... \
#     --from-literal=ALPACA_SECRET_KEY=... \
#     --from-literal=POSTGRES_PASSWORD=...
apiVersion: v1
kind: Secret
metadata:
  name: optionwright-secrets
  namespace: hackathon
type: Opaque
stringData:
  ALPACA_API_KEY: "REPLACE_ME"
  ALPACA_SECRET_KEY: "REPLACE_ME"
  POSTGRES_PASSWORD: "REPLACE_ME"
