apiVersion: apps/v1
kind: Deployment
metadata:
  name: optionwright
  namespace: hackathon
  labels:
    app: optionwright
spec:
  replicas: 1
  strategy:
    type: Recreate   # 1 solo pod: el scheduler nunca corre duplicado (evita doble cierre/doble conteo)                     # single replica: one scheduler, no double cycles
  selector:
    matchLabels:
      app: optionwright
  template:
    metadata:
      labels:
        app: optionwright
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: optionwright
          image: registry.richardx.dev/optionwright:0.1.19
          ports:
            - containerPort: 8080
          env:
            # Alpaca (paper) — from the secret
            - name: ALPACA_API_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: ALPACA_API_KEY } }
            - name: ALPACA_SECRET_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: ALPACA_SECRET_KEY } }
            - name: ALPACA_PAPER
              value: "true"
            # LLM — the shared cluster Ollama (qwen3.5:9b), native path for think=false
            # LLM — primary: Featherless (Qwen 72B, OpenAI-compatible).
            # Fallback: the shared cluster Ollama (qwen3.5:9b) if Featherless fails.
            - name: LLM_BASE_URL
              value: "https://api.featherless.ai/v1"
            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-72B-Instruct"
            - name: LLM_NATIVE_OLLAMA
              value: "false"
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: LLM_API_KEY } }
            - name: FALLBACK_LLM_BASE_URL
              value: "http://ollama-service.amael-ia:11434/v1"
            - name: FALLBACK_LLM_MODEL
              value: "qwen3.5:9b"
            # Postgres — shared instance in amael-ia, dedicated DB "hackathon"
            - name: POSTGRES_HOST
              value: "postgres-service.amael-ia"
            - name: POSTGRES_DB
              value: "hackathon"
            - name: POSTGRES_USER
              value: "hackathon"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: POSTGRES_PASSWORD } }
            # Agent behavior
            - name: UNDERLYINGS
              value: "SPY,QQQ,IWM"
            - name: CYCLE_SECONDS
              value: "120"
            - name: LOG_LEVEL
              value: "INFO"
            # Risk / strategy tuning — judged-week sprint (Sep 1-3): shorter DTE
            # (2d) so positions expire inside the judged window and rotate,
            # faster take-profit, more slots so it never blocks. Diversification
            # (per-underlying cap) intact; max loss still defined-risk.
            - name: MAX_OPEN_POSITIONS
              value: "8"
            - name: MAX_PER_UNDERLYING
              value: "3"
            - name: EXPIRY_MIN_DAYS
              value: "2"
            - name: EXPIRY_MAX_DAYS
              value: "3"
            - name: HARD_TAKE_PROFIT
              value: "0.40"
            - name: TRAIL_ACTIVATION
              value: "0.20"
            - name: TRAIL_GIVEBACK
              value: "0.10"
            - name: MAX_LOSS_PCT
              value: "0.033"
            - name: COOLDOWN_SECONDS
              value: "2700"
            - name: DAILY_BUDGET_PCT
              value: "0.22"
            - name: AGENT_RICH_CONTEXT
              value: "true"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: optionwright-service
  namespace: hackathon
  labels:
    app: optionwright
spec:
  selector:
    app: optionwright
  ports:
    - name: http
      port: 8080
      targetPort: 8080
