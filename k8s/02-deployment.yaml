apiVersion: apps/v1
kind: Deployment
metadata:
  name: optionwright
  namespace: hackathon
  labels:
    app: optionwright
spec:
  replicas: 1
  strategy:
    type: Recreate   # 1 solo pod: el scheduler nunca corre duplicado (evita doble cierre/doble conteo)                     # single replica: one scheduler, no double cycles
  selector:
    matchLabels:
      app: optionwright
  template:
    metadata:
      labels:
        app: optionwright
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: optionwright
          image: registry.richardx.dev/optionwright:0.5.2
          ports:
            - containerPort: 8080
          env:
            # Alpaca (paper) — from the secret
            - name: ALPACA_API_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: ALPACA_API_KEY } }
            - name: ALPACA_SECRET_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: ALPACA_SECRET_KEY } }
            - name: ALPACA_PAPER
              value: "true"
            # LLM — the shared cluster Ollama (qwen3.5:9b), native path for think=false
            # LLM — primary: Featherless (Qwen 72B, OpenAI-compatible).
            # Fallback: the shared cluster Ollama (qwen3.5:9b) if Featherless fails.
            - name: LLM_BASE_URL
              value: "https://api.featherless.ai/v1"
            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-72B-Instruct"
            - name: LLM_NATIVE_OLLAMA
              value: "false"
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: LLM_API_KEY } }
            - name: FALLBACK_LLM_BASE_URL
              value: "http://ollama-service.amael-ia:11434/v1"
            - name: FALLBACK_LLM_MODEL
              value: "qwen3.5:9b"
            # Postgres — shared instance in amael-ia, dedicated DB "hackathon"
            - name: POSTGRES_HOST
              value: "postgres-service.amael-ia"
            - name: POSTGRES_DB
              value: "hackathon"
            - name: POSTGRES_USER
              value: "hackathon"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: POSTGRES_PASSWORD } }
            # Agent behavior. Universe as correlation groups (0.6.0): caps and
            # cooldowns count per group. Sector ETFs / TLT / GLD probed 4-Sep: no
            # tradable spreads at 2-3 (nor 5-8) sessions; megacaps yes.
            - name: UNDERLYING_GROUPS
              value: "index:SPY,QQQ,IWM;megacap:AAPL,NVDA,AMZN,TSLA"
            - name: CHAIN_PREFETCH_WORKERS
              value: "3"
            - name: CYCLE_SECONDS
              value: "180"
            - name: EXIT_CHECK_SECONDS
              value: "60"
            - name: LOG_LEVEL
              value: "INFO"
            # ── Rule parameters: SEEDS ONLY (0.5.0). The `rules` table in Postgres
            # is the source of truth (scopes global/group/underlying, history);
            # these seed the global scope on first start. Edit via PATCH /api/rules.
            # Registry and meaning: optionwright/policy/params.py · docs/RULES.md
            # entries
            - name: EXPIRY_MIN_DAYS            # trading SESSIONS (weekends/holidays skipped since 0.4.0)
              value: "2"
            - name: EXPIRY_MAX_DAYS
              value: "3"
            - name: MAX_OPEN_POSITIONS
              value: "6"
            - name: MAX_PER_UNDERLYING
              value: "2"
            - name: MAX_PER_GROUP
              value: "2"
            - name: GROUP_COOLDOWN_SECONDS
              value: "1800"
            # selection
            - name: SHORT_DELTA
              value: "0.30"
            - name: WIDTH_PCT
              value: "0.0065"
            - name: WIDTH_TOLERANCE
              value: "0.5"
            - name: MIN_OPEN_INTEREST
              value: "100"
            - name: MAX_QUOTE_SPREAD_PCT
              value: "0.15"
            - name: MAX_LOSS_PCT
              value: "0.01"
            - name: DAILY_BUDGET_PCT
              value: "0.05"
            - name: MAX_DIRECTION_SHARE
              value: "0.60"
            - name: MAX_NET_DELTA_PCT
              value: "0.03"
            - name: MIN_REWARD_RISK
              value: "0.20"
            - name: MIN_CONFIDENCE
              value: "0.6"
            - name: COOLDOWN_SECONDS
              value: "2700"
            - name: MAX_CONSECUTIVE_LOSSES
              value: "3"
            - name: MAX_DAILY_LOSS_PCT
              value: "0.02"
            - name: OPENING_BLACKOUT_MINUTES
              value: "30"
            - name: NO_ENTRY_MINUTES_BEFORE_CLOSE
              value: "60"
            # exits
            - name: STOP_DELTA
              value: "0.45"
            - name: STOP_LOSS_MULT
              value: "1.0"
            - name: TAKE_PROFIT_FAR
              value: "0.50"
            - name: TAKE_PROFIT_NEAR
              value: "0.25"
            - name: TAKE_PROFIT_STEP_HOURS
              value: "24"
            - name: TRAIL_ACTIVATION
              value: "0.30"
            - name: TRAIL_GIVEBACK
              value: "0.07"
            - name: OVERNIGHT_MODE
              value: "flat"
            - name: FLATTEN_MINUTES_BEFORE_CLOSE
              value: "30"
            - name: OVERNIGHT_MAX_SHORT_DELTA
              value: "0.35"
            - name: OVERNIGHT_NET_DELTA_PCT
              value: "0.03"
            - name: AGENT_RICH_CONTEXT
              value: "true"
            # Bearer token for PATCH /api/rules. Optional: without it edits over the API are disabled.
            - name: RULES_TOKEN
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: RULES_TOKEN, optional: true } }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: optionwright-service
  namespace: hackathon
  labels:
    app: optionwright
spec:
  selector:
    app: optionwright
  ports:
    - name: http
      port: 8080
      targetPort: 8080
