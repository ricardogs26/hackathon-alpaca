apiVersion: apps/v1
kind: Deployment
metadata:
  name: optionwright
  namespace: hackathon
  labels:
    app: optionwright
spec:
  replicas: 1                     # single replica: one scheduler, no double cycles
  selector:
    matchLabels:
      app: optionwright
  template:
    metadata:
      labels:
        app: optionwright
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: optionwright
          image: registry.richardx.dev/optionwright:0.1.13
          ports:
            - containerPort: 8080
          env:
            # Alpaca (paper) — from the secret
            - name: ALPACA_API_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: ALPACA_API_KEY } }
            - name: ALPACA_SECRET_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: ALPACA_SECRET_KEY } }
            - name: ALPACA_PAPER
              value: "true"
            # LLM — the shared cluster Ollama (qwen3.5:9b), native path for think=false
            # LLM — primary: Featherless (Qwen 72B, OpenAI-compatible).
            # Fallback: the shared cluster Ollama (qwen3.5:9b) if Featherless fails.
            - name: LLM_BASE_URL
              value: "https://api.featherless.ai/v1"
            - name: LLM_MODEL
              value: "Qwen/Qwen2.5-72B-Instruct"
            - name: LLM_NATIVE_OLLAMA
              value: "false"
            - name: LLM_API_KEY
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: LLM_API_KEY } }
            - name: FALLBACK_LLM_BASE_URL
              value: "http://ollama-service.amael-ia:11434/v1"
            - name: FALLBACK_LLM_MODEL
              value: "qwen3.5:9b"
            # Postgres — shared instance in amael-ia, dedicated DB "hackathon"
            - name: POSTGRES_HOST
              value: "postgres-service.amael-ia"
            - name: POSTGRES_DB
              value: "hackathon"
            - name: POSTGRES_USER
              value: "hackathon"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: optionwright-secrets, key: POSTGRES_PASSWORD } }
            # Agent behavior
            - name: UNDERLYINGS
              value: "SPY,QQQ"
            - name: CYCLE_SECONDS
              value: "120"
            - name: LOG_LEVEL
              value: "INFO"
            # Risk / strategy tuning (moderate deployment increase for the contest)
            - name: MAX_OPEN_POSITIONS
              value: "5"
            - name: MAX_LOSS_PCT
              value: "0.015"
            - name: COOLDOWN_SECONDS
              value: "1800"
            - name: DAILY_BUDGET_PCT
              value: "0.10"
            - name: TAKE_PROFIT_PCT
              value: "0.40"
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: optionwright-service
  namespace: hackathon
  labels:
    app: optionwright
spec:
  selector:
    app: optionwright
  ports:
    - name: http
      port: 8080
      targetPort: 8080
