apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: optionwright-ingress
  namespace: hackathon
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Backstop against a flood reaching the shared node/DB. Behind the Cloudflare
    # tunnel nginx sees one source IP, so this acts as a generous GLOBAL cap:
    # a normal dashboard (a few viewers polling every 15s) never hits it, a flood
    # does. Cloudflare is the real per-attacker DDoS layer at the edge.
    nginx.ingress.kubernetes.io/limit-rps: "50"
    nginx.ingress.kubernetes.io/limit-connections: "100"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  tls:
    - hosts:
        - optionwright.richardx.dev
      secretName: optionwright-tls
  rules:
    - host: optionwright.richardx.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: optionwright-service
                port:
                  number: 8080
