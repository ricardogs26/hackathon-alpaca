apiVersion: v1
kind: ConfigMap
metadata:
  name: optionwright-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  optionwright-dashboard.json: |
    {
      "uid": "optionwright",
      "title": "optionwright \u2014 Trading Agent",
      "tags": [
        "optionwright",
        "hackathon",
        "alpaca"
      ],
      "timezone": "",
      "schemaVersion": 39,
      "version": 7,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": []
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Equity",
          "type": "stat",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 5,
            "h": 5
          },
          "datasource": null,
          "targets": [
            {
              "expr": "max(optionwright_equity_usd)",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currency:$",
              "decimals": 2,
              "color": {
                "mode": "fixed",
                "fixedColor": "text"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none",
            "textMode": "value"
          }
        },
        {
          "id": 2,
          "title": "Realized P&L (net)",
          "type": "stat",
          "gridPos": {
            "x": 5,
            "y": 0,
            "w": 5,
            "h": 5
          },
          "datasource": null,
          "targets": [
            {
              "expr": "max(optionwright_realized_pnl_net_usd)",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currency:$",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 0
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value",
            "textMode": "value"
          }
        },
        {
          "id": 3,
          "title": "Spreads opened (total)",
          "type": "stat",
          "gridPos": {
            "x": 10,
            "y": 0,
            "w": 5,
            "h": 5
          },
          "datasource": null,
          "targets": [
            {
              "expr": "max(optionwright_positions_total)",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none"
          }
        },
        {
          "id": 11,
          "title": "Open now",
          "type": "stat",
          "gridPos": {
            "x": 15,
            "y": 0,
            "w": 5,
            "h": 5
          },
          "datasource": null,
          "targets": [
            {
              "expr": "max(optionwright_open_positions)",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "color": {
                "mode": "fixed",
                "fixedColor": "green"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "value"
          }
        },
        {
          "id": 4,
          "title": "Cycle errors (current pod)",
          "type": "stat",
          "gridPos": {
            "x": 20,
            "y": 0,
            "w": 4,
            "h": 5
          },
          "datasource": null,
          "targets": [
            {
              "expr": "sum(optionwright_errors_total) or vector(0)",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "background"
          }
        },
        {
          "id": 5,
          "title": "Account equity",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 5,
            "w": 16,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "expr": "max(optionwright_equity_usd)",
              "datasource": null,
              "refId": "A",
              "legendFormat": "equity"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currency:$",
              "custom": {
                "fillOpacity": 12,
                "lineWidth": 2,
                "showPoints": "never"
              },
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "showLegend": false
            }
          }
        },
        {
          "id": 6,
          "title": "LLM confidence (on trades)",
          "type": "gauge",
          "gridPos": {
            "x": 16,
            "y": 5,
            "w": 8,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "expr": "max(optionwright_confidence_opened)",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 1,
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.5
                  },
                  {
                    "color": "green",
                    "value": 0.65
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 7,
          "title": "LLM latency p90",
          "type": "stat",
          "gridPos": {
            "x": 16,
            "y": 9,
            "w": 8,
            "h": 4
          },
          "datasource": null,
          "targets": [
            {
              "expr": "histogram_quantile(0.90, sum by (le) (rate(optionwright_llm_latency_seconds_bucket[10m])))",
              "datasource": null,
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 2
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "colorMode": "none"
          }
        },
        {
          "id": 8,
          "title": "Cycles by result (10m rate)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "expr": "sum by (result) (rate(optionwright_cycles_total[10m]))",
              "datasource": null,
              "refId": "A",
              "legendFormat": "{{result}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 18,
                "stacking": {
                  "mode": "normal"
                },
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {}
        },
        {
          "id": 9,
          "title": "Decisions by direction",
          "type": "piechart",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "expr": "sum by (direction) (optionwright_decisions_total)",
              "datasource": null,
              "refId": "A",
              "legendFormat": "{{direction}}"
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value"
              ]
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 10,
          "title": "Open positions (live evaluation)",
          "type": "table",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 8
          },
          "datasource": null,
          "targets": [
            {
              "expr": "optionwright_position_info",
              "datasource": null,
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "job": true,
                  "instance": true,
                  "container": true,
                  "endpoint": true,
                  "namespace": true,
                  "pod": true,
                  "service": true,
                  "prometheus": true
                },
                "renameByName": {
                  "pos_id": "Pos",
                  "underlying": "Spread",
                  "credit": "Credit",
                  "close_price": "Close now",
                  "captured_pct": "Captured",
                  "decision": "Decision",
                  "Value": "P&L now ($)"
                },
                "indexByName": {
                  "pos_id": 0,
                  "underlying": 1,
                  "credit": 2,
                  "close_price": 3,
                  "Value": 4,
                  "captured_pct": 5,
                  "decision": 6
                }
              }
            }
          ],
          "fieldConfig": {
            "defaults": {},
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "P&L now ($)"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-text"
                    }
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "green",
                          "value": 0
                        }
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "showHeader": true,
            "sortBy": [
              {
                "displayName": "Pos",
                "desc": false
              }
            ]
          }
        },
        {
          "id": 12,
          "type": "stat",
          "title": "Book vs broker (legs off)",
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "max(optionwright_reconcile_mismatch) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "reconciled",
                      "color": "green"
                    }
                  }
                }
              ]
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 13,
          "type": "stat",
          "title": "Entries filled / pending / unfilled (24h)",
          "gridPos": {
            "x": 4,
            "y": 29,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(increase(optionwright_orders_total{kind=\"entry\",result=\"filled\"}[24h])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 14,
          "type": "stat",
          "title": "Closes reverted (24h)",
          "gridPos": {
            "x": 8,
            "y": 29,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(increase(optionwright_orders_total{kind=\"close\",result=\"reverted\"}[24h])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 15,
          "type": "stat",
          "title": "Fallback decided (24h)",
          "gridPos": {
            "x": 12,
            "y": 29,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(increase(optionwright_llm_decisions_total{outcome=\"fallback\"}[24h])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 16,
          "type": "stat",
          "title": "LLM empty completions (24h)",
          "gridPos": {
            "x": 16,
            "y": 29,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(increase(optionwright_errors_total{where=\"llm_empty\"}[24h])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 3
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 17,
          "type": "stat",
          "title": "Snapshot / tick failures (24h)",
          "gridPos": {
            "x": 20,
            "y": 29,
            "w": 4,
            "h": 5
          },
          "targets": [
            {
              "expr": "sum(increase(optionwright_errors_total{where=~\"snapshot|tick\"}[24h])) or vector(0)",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 5
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            }
          }
        },
        {
          "id": 18,
          "type": "timeseries",
          "title": "Orders by kind and result (1h)",
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (kind, result) (increase(optionwright_orders_total[1h]))",
              "legendFormat": "{{kind}} {{result}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 19,
          "type": "piechart",
          "title": "Who decided (model \u00b7 outcome)",
          "gridPos": {
            "x": 12,
            "y": 34,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (model, outcome) (optionwright_llm_decisions_total)",
              "legendFormat": "{{model}} \u00b7 {{outcome}}",
              "refId": "A",
              "instant": true
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "values": [
                "value",
                "percent"
              ]
            },
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ]
            },
            "pieType": "donut"
          }
        },
        {
          "id": 20,
          "type": "timeseries",
          "title": "Errors by origin (1h)",
          "gridPos": {
            "x": 0,
            "y": 42,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum by (where) (increase(optionwright_errors_total[1h]))",
              "legendFormat": "{{where}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        },
        {
          "id": 21,
          "type": "timeseries",
          "title": "LLM latency p50 / p90",
          "gridPos": {
            "x": 12,
            "y": 42,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.5, sum by (le) (rate(optionwright_llm_latency_seconds_bucket[15m])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "expr": "histogram_quantile(0.9, sum by (le) (rate(optionwright_llm_latency_seconds_bucket[15m])))",
              "legendFormat": "p90",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "none"
                }
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "multi"
            }
          }
        }
      ]
    }
